# PhpStorm version the plugin is built against when local.properties is absent
# (on CI the platform is downloaded from the JetBrains repository).
phpstormVersion=2026.2

pluginGroup=ru.opencart.idea
pluginVersion=0.1.0
pluginSinceBuild=262

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.stdlib.default.dependency=false
